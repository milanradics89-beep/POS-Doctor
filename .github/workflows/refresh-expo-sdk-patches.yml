name: Refresh Expo SDK patch dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - ci/google-cloud-wif-auth-test

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/google-cloud-wif-auth-test
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Expo SDK patch versions and lockfile
        run: |
          set -euo pipefail
          npm install 'expo-constants@~57.0.25' 'expo-image-picker@~57.0.22' 'expo-router@~57.0.32'
      - name: Validate Expo dependency alignment
        run: |
          npx --yes expo-doctor@1.20.5
      - name: Commit dependency refresh
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: align Expo SDK patch dependencies"
          git push origin ci/google-cloud-wif-auth-test
