name: Backend container build

on:
  pull_request:
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-container-build.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-container-build.yml"

permissions:
  contents: read

concurrency:
  group: backend-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build backend image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --pull --file backend/Dockerfile --tag useit-backend:ci .
