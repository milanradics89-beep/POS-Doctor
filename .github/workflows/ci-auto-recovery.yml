name: USEIT CI auto-recovery

on:
  workflow_run:
    workflows:
      - USEIT validation
      - USEIT CodeQL
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: useit-ci-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-transient-failures:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Retrying transient failure once: $RUN_NAME ($RUN_ID)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          {
            echo "## USEIT CI auto-recovery"
            echo
            echo "A failed workflow was automatically retried once."
            echo "- Workflow: $RUN_NAME"
            echo "- Original run: $RUN_URL"
            echo "- Commit: $HEAD_SHA"
            echo
            echo "This retry does not modify source code. If it fails again, investigate the job logs."
          } >> "$GITHUB_STEP_SUMMARY"

  report-repeated-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt >= 2 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update a diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="[CI] Repeated failure: $RUN_NAME"
          BODY=$(cat <<EOF
          The workflow failed after its automatic retry.

          - Workflow: $RUN_NAME
          - Run: $RUN_URL
          - Commit: $HEAD_SHA
          - Run ID: $RUN_ID

          Inspect the failed job logs and fix the underlying issue. This automation does not commit code or merge pull requests.
          EOF
          )
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title --limit 1000 |
            jq -r --arg title "$TITLE" 'first(.[] | select(.title == $title) | .number) // empty')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
