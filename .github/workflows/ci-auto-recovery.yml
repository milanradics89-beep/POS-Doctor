name: USEIT CI recovery (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the controlled recovery operation
        required: true
        type: choice
        options:
          - retry-failed-jobs-once
          - report-repeated-failure
      run_id:
        description: GitHub Actions run ID to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: useit-ci-recovery-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  retry-transient-failures:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'retry-failed-jobs-once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate target run and retry only an eligible first failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must contain only decimal digits."
            exit 1
          fi
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repository and
            .conclusion == "failure" and
            .run_attempt == 1 and
            (.name == "USEIT validation" or .name == "USEIT CodeQL")
          ' <<< "$RUN_JSON" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "Validated and requested one retry for run ${RUN_ID}." >> "$GITHUB_STEP_SUMMARY"

  report-repeated-failure:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'report-repeated-failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update a diagnostic issue for a repeated failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must contain only decimal digits."
            exit 1
          fi
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repository and
            .conclusion == "failure" and
            .run_attempt >= 2 and
            (.name == "USEIT validation" or .name == "USEIT CodeQL")
          ' <<< "$RUN_JSON" >/dev/null
          RUN_NAME="$(jq -r '.name' <<< "$RUN_JSON")"
          RUN_URL="$(jq -r '.html_url' <<< "$RUN_JSON")"
          HEAD_SHA="$(jq -r '.head_sha' <<< "$RUN_JSON")"
          TITLE="[CI] Repeated failure: $RUN_NAME"
          BODY="$(printf '%s\n' \
            "The workflow failed after its single permitted retry." \
            "" \
            "- Workflow: $RUN_NAME" \
            "- Run: $RUN_URL" \
            "- Commit: $HEAD_SHA" \
            "- Run ID: $RUN_ID" \
            "" \
            "Inspect the failed job logs and fix the underlying issue. This workflow does not commit code or merge pull requests.")"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --limit 1000 |
            jq -r --arg title "$TITLE" 'first(.[] | select(.title == $title) | .number) // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
