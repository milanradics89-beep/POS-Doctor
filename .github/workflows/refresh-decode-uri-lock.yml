name: Temporary dependency lock refresh

on:
  push:
    branches: [fix/release-blockers-2026-10]
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-decode-uri-lock.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile from the patched package
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency resolution
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/decode-uri-component']; if (!p || p.version !== '0.5.1' || !p.integrity) process.exit(1); console.log({version:p.version,integrity:p.integrity})"
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
