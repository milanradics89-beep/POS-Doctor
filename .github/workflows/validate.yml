name: USEIT validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce USEIT source boundary
        run: npm run guard:useit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Expo project health
        run: npx expo-doctor
      - name: Validate Android export
        run: npx expo export --platform android --output-dir .expo-export
      - name: Validate native Android release build
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Install and launch Android emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          EMULATOR_BIN="${ANDROID_HOME}/emulator/emulator"
          ADB_BIN="${ANDROID_HOME}/platform-tools/adb"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          test -x "$EMULATOR_BIN"
          test -x "$ADB_BIN"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo "no" | "$AVDMANAGER" create avd -n useit-ci -k "system-images;android-35;google_apis;x86_64" --force
          "$EMULATOR_BIN" -avd useit-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/useit-emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            "$ADB_BIN" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$ADB_BIN" wait-for-device
          until "$ADB_BIN" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; do
            sleep 2
          done
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          PACKAGE_NAME="$(aapt dump badging "$APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test -n "$PACKAGE_NAME"
          "$ADB_BIN" install -r "$APK_PATH"
          "$ADB_BIN" shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
          sleep 5
          "$ADB_BIN" shell pidof "$PACKAGE_NAME"
          "$ADB_BIN" shell am force-stop "$PACKAGE_NAME"