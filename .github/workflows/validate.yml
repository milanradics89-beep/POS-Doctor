name: USEIT validation

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce USEIT source boundary
        run: npm run guard:useit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Install pinned Expo Doctor CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo-doctor"
          # Expo's published sdk-57 dist-tag resolves to expo-doctor 1.20.5.
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP/expo-doctor" expo-doctor@1.20.5)"
          mkdir -p node_modules/expo-doctor
          tar -xzf "$RUNNER_TEMP/expo-doctor/$TARBALL" -C node_modules/expo-doctor --strip-components=1
          node -e "const pkg = require('./node_modules/expo-doctor/package.json'); if (pkg.version !== '1.20.5') throw new Error('Unexpected Expo Doctor version'); require.resolve('@expo/env')"
      - name: Validate Expo project health
        run: node node_modules/expo-doctor/bin/expo-doctor.js
      - name: Validate Android export
        run: npx expo export --platform android --output-dir .expo-export
      - name: Validate native Android release build
        run: |
          npx expo prebuild --platform android --no-install
          python - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          properties = wrapper.read_text(encoding="utf-8")
          if re.search(r"(?m)^networkTimeout=", properties):
              properties = re.sub(r"(?m)^networkTimeout=.*$", "networkTimeout=120000", properties)
          else:
              properties = properties.rstrip() + "\nnetworkTimeout=120000\n"
          wrapper.write_text(properties, encoding="utf-8")
          if not re.search(r"(?m)^networkTimeout=120000$", properties):
              raise SystemExit("Gradle wrapper network timeout was not configured.")
          print("Gradle wrapper download timeout configured to 120 seconds.")
          PY
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner; Android x86_64 emulator cannot use hardware acceleration."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
      - name: Install and launch Android emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          # Keep all Android user/AVD state under the canonical path. Ubuntu 24.04
          # runners can otherwise split avdmanager state between ~/.config/.android
          # and ~/.android, leaving the emulator unable to discover the AVD.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_EMULATOR_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"
          AVDMANAGER="$(command -v avdmanager || true)"
          ADB_BIN="$(command -v adb || true)"
          AAPT_BIN="$(command -v aapt || true)"

          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi
          if [[ -z "$AVDMANAGER" ]]; then AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/avdmanager' -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi
          if [[ -z "$ADB_BIN" && -x "$SDK_ROOT/platform-tools/adb" ]]; then ADB_BIN="$SDK_ROOT/platform-tools/adb"; fi
          if [[ -z "$AAPT_BIN" ]]; then AAPT_BIN="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi

          printf 'Android SDK: %s\nsdkmanager: %s\navdmanager: %s\nadb: %s\naapt: %s\n' "$SDK_ROOT" "$SDKMANAGER" "$AVDMANAGER" "$ADB_BIN" "$AAPT_BIN"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$ADB_BIN"
          test -x "$AAPT_BIN"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

          EMULATOR_BIN="$SDK_ROOT/emulator/emulator"
          if [[ ! -x "$EMULATOR_BIN" ]]; then EMULATOR_BIN="$(command -v emulator || true)"; fi
          test -x "$EMULATOR_BIN"
          printf 'emulator: %s\n' "$EMULATOR_BIN"

          AVD_NAME="useit-ci"
          echo "no" | "$AVDMANAGER" create avd -n "$AVD_NAME" -k "system-images;android-35;google_apis;x86_64" --force

          echo "=== configured AVDs ==="
          "$EMULATOR_BIN" -list-avds
          "$AVDMANAGER" list avd
          "$EMULATOR_BIN" -list-avds | grep -Fxq "$AVD_NAME"

          echo "=== emulator acceleration check ==="
          "$EMULATOR_BIN" -accel-check

          EMULATOR_LOG="$RUNNER_TEMP/useit-emulator.log"
          EMULATOR_PID=""
          cleanup() {
            "$ADB_BIN" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            if [[ -n "$EMULATOR_PID" ]]; then
              kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          echo "Starting emulator..."
          setsid "$EMULATOR_BIN" \
            -avd "$AVD_NAME" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel on \
            </dev/null >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          "$ADB_BIN" start-server

          if ! timeout 120 "$ADB_BIN" -s emulator-5554 wait-for-device; then
            echo "Android emulator did not become visible to ADB within 120 seconds."
            echo "=== emulator log ==="
            cat "$EMULATOR_LOG" || true
            echo "=== adb devices ==="
            "$ADB_BIN" devices -l || true
            echo "=== emulator/qemu processes ==="
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            exit 1
          fi

          BOOT_TIMEOUT=300
          BOOT_DEADLINE=$((SECONDS + BOOT_TIMEOUT))
          while (( SECONDS < BOOT_DEADLINE )); do
            BOOT_COMPLETED="$("$ADB_BIN" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$BOOT_COMPLETED" == "1" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$("$ADB_BIN" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]]; then
            echo "Android emulator did not finish booting within ${BOOT_TIMEOUT} seconds."
            echo "=== emulator log ==="
            cat "$EMULATOR_LOG" || true
            echo "=== adb devices ==="
            "$ADB_BIN" devices -l || true
            echo "=== boot properties ==="
            "$ADB_BIN" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true
            exit 1
          fi

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          PACKAGE_NAME="$("$AAPT_BIN" dump badging "$APK_PATH" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test -n "$PACKAGE_NAME"
          "$ADB_BIN" -s emulator-5554 install -r "$APK_PATH"
          "$ADB_BIN" -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
          sleep 5
          "$ADB_BIN" -s emulator-5554 shell pidof "$PACKAGE_NAME"
          "$ADB_BIN" -s emulator-5554 shell am force-stop "$PACKAGE_NAME"
          echo "Android emulator smoke test passed for $PACKAGE_NAME"

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency-tree npm audit
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/npm-audit.json"
          set +e
          npm audit --json > "$REPORT"
          audit_status=$?
          set -e
          node - "$REPORT" "$audit_status" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const npmExitCode = Number(process.argv[3]);
          if (report.error || !report.vulnerabilities || !report.metadata?.vulnerabilities) {
            throw new Error('npm audit did not return a complete vulnerability report.');
          }
          const entries = Object.entries(report.vulnerabilities);
          const counts = report.metadata.vulnerabilities;
          console.log('Full dependency audit counts:', JSON.stringify(counts));
          for (const [name, item] of entries.sort((a, b) => a[0].localeCompare(b[0]))) {
            const via = (item.via || []).map((entry) =>
              typeof entry === 'string' ? entry : `${entry.name || 'advisory'}: ${entry.title || entry.url || 'details unavailable'}`
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via,
            }));
          }
          const blocking = (counts.high || 0) + (counts.critical || 0);
          if (blocking > 0) {
            console.error(`Blocking high/critical npm advisories: ${blocking}`);
            process.exit(1);
          }
          console.log('No high or critical npm advisories found in the full dependency tree.');
          if (npmExitCode !== 0 && entries.length === 0) {
            throw new Error('npm audit exited non-zero without reporting advisories.');
          }
          NODE
      - name: Upload full npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-full-audit-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate native iOS project
        env:
          EAS_BUILD_PROFILE: production
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Validate native iOS release build
        run: |
          xcodebuild \
            -workspace ios/USEIT.xcworkspace \
            -scheme USEIT \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios-simulator \
            build
      - name: Install and launch iOS simulator smoke test
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [[ -n "${DEVICE_UDID:-}" ]]; then
              xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          DEVICE_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [[ -z "$DEVICE_UDID" ]]; then
            echo "No available iPhone simulator found on the runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting iOS simulator $DEVICE_UDID..."
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH="$(find build/ios-simulator -type d -name 'USEIT.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "USEIT.app was not produced by the iOS Release simulator build."
            find build/ios-simulator -maxdepth 6 -type d -name '*.app' -print || true
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test -n "$BUNDLE_ID"
          echo "Installing $BUNDLE_ID from $APP_PATH"

          echo "Installing app into simulator..."
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          echo "Launching app in simulator..."
          node scripts/ios-simulator-launch.mjs "$DEVICE_UDID" "$BUNDLE_ID"
          echo "iOS simulator smoke test passed for $BUNDLE_ID"

  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      USEIT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m pytest -q backend
      - name: Production readiness checks
        run: bash scripts/production-readiness.sh
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt
