name: USEIT validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce USEIT source boundary
        run: npm run guard:useit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Expo project health
        run: npx expo-doctor
      - name: Validate Android export
        run: npx expo export --platform android --output-dir .expo-export
      - name: Validate native Android release build
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Install and launch Android emulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          EMULATOR_BIN="$(command -v emulator || true)"
          ADB_BIN="$(command -v adb || true)"
          SDKMANAGER="$(command -v sdkmanager || true)"
          AVDMANAGER="$(command -v avdmanager || true)"
          AAPT_BIN="$(command -v aapt || true)"

          if [[ -z "$EMULATOR_BIN" && -x "$SDK_ROOT/emulator/emulator" ]]; then EMULATOR_BIN="$SDK_ROOT/emulator/emulator"; fi
          if [[ -z "$ADB_BIN" && -x "$SDK_ROOT/platform-tools/adb" ]]; then ADB_BIN="$SDK_ROOT/platform-tools/adb"; fi
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi
          if [[ -z "$AVDMANAGER" ]]; then AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/avdmanager' -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi
          if [[ -z "$AAPT_BIN" ]]; then AAPT_BIN="$(find "$SDK_ROOT/build-tools" -type f -name aapt -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"; fi

          printf 'Android SDK: %s\n' "$SDK_ROOT"
          printf 'emulator: %s\nadb: %s\nsdkmanager: %s\navdmanager: %s\naapt: %s\n' "$EMULATOR_BIN" "$ADB_BIN" "$SDKMANAGER" "$AVDMANAGER" "$AAPT_BIN"

          test -x "$EMULATOR_BIN"
          test -x "$ADB_BIN"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$AAPT_BIN"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd -n useit-ci -k "system-images;android-35;google_apis;x86_64" --force
          "$EMULATOR_BIN" -avd useit-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/useit-emulator.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            "$ADB_BIN" -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$ADB_BIN" wait-for-device
          timeout 180 bash -c '
            until "$0" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r" | grep -q "^1$"; do sleep 2; done
          ' "$ADB_BIN"

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          PACKAGE_NAME="$("$AAPT_BIN" dump badging "$APK_PATH" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test -n "$PACKAGE_NAME"
          "$ADB_BIN" -s emulator-5554 install -r "$APK_PATH"
          "$ADB_BIN" -s emulator-5554 shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1
          sleep 5
          "$ADB_BIN" -s emulator-5554 shell pidof "$PACKAGE_NAME"
          "$ADB_BIN" -s emulator-5554 shell am force-stop "$PACKAGE_NAME"
          echo "Android emulator smoke test passed for $PACKAGE_NAME"

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Validate native iOS release build
        run: |
          xcodebuild \
            -workspace ios/USEIT.xcworkspace \
            -scheme USEIT \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios-simulator \
            build
      - name: Install and launch iOS simulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [[ -n "${DEVICE_UDID:-}" ]]; then
              xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          DEVICE_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          if [[ -z "$DEVICE_UDID" ]]; then
            echo "No available iPhone simulator found on the runner."
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH="$(find build/ios-simulator -type d -name 'USEIT.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "USEIT.app was not produced by the iOS Release simulator build."
            find build/ios-simulator -maxdepth 6 -type d -name '*.app' -print || true
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test -n "$BUNDLE_ID"
          echo "Installing $BUNDLE_ID from $APP_PATH"

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID"
          sleep 3
          xcrun simctl spawn "$DEVICE_UDID" launchctl print system 2>/dev/null >/dev/null

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m pytest -q backend
      - name: Production readiness checks
        run: bash scripts/production-readiness.sh
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt
