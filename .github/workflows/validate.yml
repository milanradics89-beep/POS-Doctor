name: USEIT validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce USEIT source boundary
        run: npm run guard:useit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Expo project health
        run: npx expo-doctor
      - name: Validate Android export
        run: npx expo export --platform android --output-dir .expo-export
      - name: Validate native Android release build
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install ios
      - name: Validate native iOS release build
        run: |
          xcodebuild \
            -workspace ios/USEIT.xcworkspace \
            -scheme USEIT \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios-simulator \
            build
      - name: Install and launch iOS simulator smoke test
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH="build/ios-simulator/Build/Products/Release-iphonesimulator/USEIT.app"
          test -d "$APP_PATH"
          BUNDLE_ID="$(xcodebuild -showBuildSettings -workspace ios/USEIT.xcworkspace -scheme USEIT | awk -F ' = ' '/PRODUCT_BUNDLE_IDENTIFIER/{print $2; exit}')"
          test -n "$BUNDLE_ID"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID"
          xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
          xcrun simctl shutdown "$DEVICE_UDID"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m pytest -q backend
      - name: Production readiness checks
        run: bash scripts/production-readiness.sh
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt
