name: USEIT code quality and workflow security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: v1.31.1
          advanced-security: false
          annotations: true

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Scan the complete pull request commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          test -n "$PR_NUMBER"
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
          FETCHED_HEAD="$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER")"
          if [[ "$FETCHED_HEAD" != "$HEAD_SHA" ]]; then
            echo "::error::Fetched PR head does not match the event head SHA."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          gitleaks detect --redact --no-banner --exit-code=2 --report-format=sarif --report-path=results-full-pr-history.sarif --log-opts="$BASE_SHA..$HEAD_SHA"
