name: Temporary Expo SDK 57 lockfile refresh

on:
  push:
    branches:
      - fix/release-blockers-2026-10
    paths:
      - .github/workflows/expo-sdk57-lock-refresh.yml

concurrency:
  group: expo-sdk57-lock-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install current lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Add the SDK-matched Expo Modules Core dependency
        run: npx expo install expo-modules-core
      - name: Reinstall from regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo Modules Core package and declarations
        run: |
          node -e "const fs=require('node:fs'); const p=require('./node_modules/expo-modules-core/package.json'); const types=p.types || p.typings; console.log(JSON.stringify({version:p.version,types,typesPresent:!!types && fs.existsSync('node_modules/expo-modules-core/'+types)},null,2));"
          npm ls expo-modules-core
      - name: Verify Expo dependency alignment
        run: npx expo-doctor
      - name: Verify frontend types
        run: npm run typecheck
      - name: Verify frontend tests
        run: npm test -- --passWithNoTests
      - name: Upload regenerated manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expo-sdk57-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
