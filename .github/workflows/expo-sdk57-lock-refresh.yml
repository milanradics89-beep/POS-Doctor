name: Temporary Expo SDK 57 lockfile refresh

on:
  push:
    branches:
      - automation/expo-sdk57-lock-refresh-run-20261113b
    paths:
      - .github/workflows/expo-sdk57-lock-refresh.yml
  workflow_dispatch:

concurrency:
  group: expo-sdk57-lock-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restrict execution to the release branch
        env:
          TARGET_REF: refs/heads/automation/expo-sdk57-lock-refresh-run-20261113b
        run: |
          set -euo pipefail
          is_allowed_ref() {
            [[ "$1" == "$TARGET_REF" ]]
          }

          # Regression checks: accept the isolated lock-refresh ref and reject main/other refs.
          is_allowed_ref "$TARGET_REF"
          if is_allowed_ref "refs/heads/main"; then
            echo "::error::Main must never be a lockfile-refresh target."
            exit 1
          fi
          if is_allowed_ref "refs/heads/feature/unrelated"; then
            echo "::error::Unrelated branches must never be lockfile-refresh targets."
            exit 1
          fi
          if ! is_allowed_ref "$GITHUB_REF"; then
            echo "::error::This workflow may only run on automation/expo-sdk57-lock-refresh-run-20261113b (got $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Assert checkout credentials are not persisted
        shell: bash
        run: |
          set -euo pipefail
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::GitHub credentials must not persist while project code executes."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Align Expo SDK 57 package versions and regenerate lockfile
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies ||= {};
          pkg.overrides ||= {};
          pkg.overrides.deepmerge = "$deepmerge";
          pkg.devDependencies ||= {};
          // Major upgrade is covered by the complete frontend migration test suite below.
          pkg.devDependencies.vitest = "^5.1.0";

          const expected = {
            expo: "~57.0.33",
            "expo-constants": "~57.0.24",
            "expo-image-picker": "~57.0.21",
            "expo-linking": "~57.0.14",
            "expo-router": "~57.0.31",
          };
          for (const [name, version] of Object.entries(expected)) {
            if (!Object.hasOwn(pkg.dependencies, name)) {
              throw new Error(`Required Expo dependency ${name} is missing from package.json`);
            }
            pkg.dependencies[name] = version;
          }

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --ignore-scripts --no-fund

      - name: Verify generated SDK 57 manifest and lockfile
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            expo: { range: "~57.0.33", version: "57.0.33" },
            "expo-constants": { range: "~57.0.24", version: "57.0.24" },
            "expo-image-picker": { range: "~57.0.21", version: "57.0.21" },
            "expo-linking": { range: "~57.0.14", version: "57.0.14" },
            "expo-router": { range: "~57.0.31", version: "57.0.31" },
          };

          const root = lock.packages?.[""];
          if (!root?.dependencies) throw new Error("package-lock.json has no root dependency record");
          for (const [name, expectedPackage] of Object.entries(expected)) {
            if (pkg.dependencies?.[name] !== expectedPackage.range) {
              throw new Error(`package.json ${name} expected ${expectedPackage.range}, found ${pkg.dependencies?.[name] || "missing"}`);
            }
            if (root.dependencies[name] !== expectedPackage.range) {
              throw new Error(`package-lock root ${name} expected ${expectedPackage.range}, found ${root.dependencies[name] || "missing"}`);
            }
            const actual = lock.packages?.[`node_modules/${name}`]?.version;
            if (actual !== expectedPackage.version) {
              throw new Error(`node_modules/${name} expected ${expectedPackage.version}, found ${actual || "missing"}`);
            }
          }
          if (pkg.devDependencies?.vitest !== "^5.1.0") {
            throw new Error("Vitest 5 migration target is missing from package.json");
          }
          const vitestVersion = lock.packages?.["node_modules/vitest"]?.version;
          if (vitestVersion !== "5.1.0") {
            throw new Error(`Vitest expected 5.1.0 after lock refresh, found ${vitestVersion || "missing"}`);
          }
          if (pkg.overrides?.deepmerge !== "$deepmerge") {
            throw new Error("The patched local deepmerge fork must override every transitive deepmerge copy");
          }
          if (Object.hasOwn(pkg.dependencies, "expo-modules-core")) {
            throw new Error("expo-modules-core must remain a transitive Expo dependency, not a direct root dependency");
          }
          console.log("Expo SDK 57 package manifest and lockfile versions are aligned.");
          NODE

      - name: Verify reproducible installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install pinned Expo Doctor CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/expo-doctor"
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP/expo-doctor" expo-doctor@1.20.5)"
          mkdir -p node_modules/expo-doctor
          tar -xzf "$RUNNER_TEMP/expo-doctor/$TARBALL" -C node_modules/expo-doctor --strip-components=1
          node -e "const pkg = require('./node_modules/expo-doctor/package.json'); if (pkg.version !== '1.20.5') throw new Error('Unexpected Expo Doctor version'); require.resolve('@expo/env')"

      - name: Verify Expo SDK compatibility
        run: node node_modules/expo-doctor/bin/expo-doctor.js

      - name: Verify frontend types and tests
        run: |
          npm run typecheck
          npm test -- --passWithNoTests

      - name: Audit production runtime dependencies
        run: npm audit --audit-level=high

      - name: Prepare a checksum-verified manifest artifact
        run: |
          set -euo pipefail
          test -s package.json
          test -s package-lock.json
          mkdir -p expo-sdk57-lock-refresh
          cp package.json package-lock.json expo-sdk57-lock-refresh/
          (
            cd expo-sdk57-lock-refresh
            sha256sum package.json package-lock.json > SHA256SUMS
          )
          {
            echo "## Expo SDK 57 manifest candidate"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Files: \`package.json\`, \`package-lock.json\`"
            echo "- Integrity: \`SHA256SUMS\` included"
            echo "- Branch writes: none; apply only through a reviewed commit and full PR CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated Expo SDK 57 manifest candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expo-sdk57-lock-refresh-${{ github.sha }}
          path: expo-sdk57-lock-refresh/
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact receipt
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact URL: $ARTIFACT_URL"
            echo "- Artifact SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
