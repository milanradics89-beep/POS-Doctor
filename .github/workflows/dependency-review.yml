name: USEIT dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # This action requires GitHub's dependency graph to be enabled for the repo.
    # Keep the review active when the repository setting is available; the
    # npm audit and pip-audit checks in validate.yml remain mandatory regardless.
    if: ${{ vars.USEIT_DEPENDENCY_GRAPH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
